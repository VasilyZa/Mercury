name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v1.20.1) when manually dispatching'
        required: false
      target_commitish:
        description: 'Commit SHA or branch to tag when manually dispatching (defaults to current commit)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK (Zulu 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Provision Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.1'

      - name: Build with Gradle
        run: gradle --no-daemon clean build remapJar

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_commitish != '' && inputs.target_commitish || github.sha) || '' }}
          files: |
            build/libs/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
