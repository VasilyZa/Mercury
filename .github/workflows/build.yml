name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v1.20.1) when manually dispatching'
        required: false
      target_commitish:
        description: 'Commit SHA or branch to tag when manually dispatching (defaults to current commit)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_commitish != '' && inputs.target_commitish || github.sha) || github.ref }}

      - name: Set up JDK (Zulu 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Provision Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.1'

      - name: Resolve version and commit hash
        id: vars
        shell: bash
        run: |
          RAW_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          # Normalize ref name if needed
          RAW_TAG="${RAW_TAG##*/}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$RAW_TAG" ]; then
              # No tag provided on manual run; read from gradle.properties and synthesize a tag
              VERSION_FROM_FILE=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
              RAW_TAG="v${VERSION_FROM_FILE}"
            fi
          fi

          VERSION_NO_PREFIX="${RAW_TAG#v}"
          FULL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "version=${VERSION_NO_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Permission
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f ./gradlew ]; then
            ./gradlew --no-daemon clean build remapJar -Pmod_version="${{ steps.vars.outputs.version }}"
          else
            gradle --no-daemon clean build remapJar -Pmod_version="${{ steps.vars.outputs.version }}"
          fi
          
      - name: Rename artifact to Mercury-{version}-{commit}.jar
        id: rename
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          SHA="${{ steps.vars.outputs.commit_sha }}"

          mkdir -p dist
          # Prefer remapped production jar (exclude sources/dev/javadoc)
          FILE=$(ls -1 build/libs/*.jar | grep -vE 'sources|dev|javadoc' | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "No jar found in build/libs" >&2
            ls -al build/libs || true
            exit 1
          fi

          NEW_PATH="dist/Mercury-${VERSION}-${SHA}.jar"
          cp "$FILE" "$NEW_PATH"

          echo "path=${NEW_PATH}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_commitish != '' && inputs.target_commitish || github.sha) || '' }}
          files: ${{ steps.rename.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true 
